<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect width="1200" height="630" fill="#0d0d0d"/>
  <rect x="0" y="0" width="1200" height="6" fill="#d03b3b"/>

  <image x="72" y="76" width="92" height="92" href="LOGO_DATA_URI" preserveAspectRatio="xMidYMid meet"/>
  <text x="186" y="118" fill="#ffffff" font-size="27" font-weight="600">Nature Disaster Alert</text>
  <text x="186" y="150" fill="#898781" font-size="20">by DTEmpire</text>

  <text x="72" y="252" fill="#ffffff" font-size="60" font-weight="600">Know what is happening</text>
  <text x="72" y="322" fill="#ffffff" font-size="60" font-weight="600">around you</text>

  <text x="72" y="380" fill="#c3c2b7" font-size="24">Live floods, landslides and earthquakes across Nepal,</text>
  <text x="72" y="414" fill="#c3c2b7" font-size="24">with emergency numbers one tap away.</text>

  <g transform="translate(72 462)">
    <rect width="272" height="46" rx="8" fill="#1a1a19" stroke="#2c2c2a"/>
    <circle cx="24" cy="23" r="6" fill="#d03b3b"/>
    <text x="42" y="30" fill="#c3c2b7" font-size="17">BIPAD, Government of Nepal</text>
  </g>
  <g transform="translate(360 462)">
    <rect width="104" height="46" rx="8" fill="#1a1a19" stroke="#2c2c2a"/>
    <circle cx="24" cy="23" r="6" fill="#3987e5"/>
    <text x="42" y="30" fill="#c3c2b7" font-size="17">USGS</text>
  </g>
  <g transform="translate(480 462)">
    <rect width="116" height="46" rx="8" fill="#1a1a19" stroke="#2c2c2a"/>
    <circle cx="24" cy="23" r="6" fill="#ec835a"/>
    <text x="42" y="30" fill="#c3c2b7" font-size="17">GDACS</text>
  </g>
  <g transform="translate(612 462)">
    <rect width="146" height="46" rx="8" fill="#1a1a19" stroke="#2c2c2a"/>
    <circle cx="24" cy="23" r="6" fill="#0ca30c"/>
    <text x="42" y="30" fill="#c3c2b7" font-size="17">NASA EONET</text>
  </g>

  <line x1="72" y1="548" x2="1128" y2="548" stroke="#2c2c2a"/>
  <text x="72" y="586" fill="#898781" font-size="20">disasteralert.ankitgupta.com.np</text>
  <text x="1128" y="586" fill="#898781" font-size="20" text-anchor="end">Free on Android and iPhone</text>
